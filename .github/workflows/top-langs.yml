name: Generate top languages card

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate top languages
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=m-bonanno&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Quando la query GraphQL viene rifiutata l'action non fallisce: scrive
      # una card "Something went wrong" e chiude con successo. Va quindi
      # controllato il contenuto, altrimenti una card rotta finisce in un
      # commit e sostituisce quella buona gia' pubblicata.
      - name: Discard error card
        run: |
          if [ -f profile/top-langs.svg ] && grep -q "Something went wrong" profile/top-langs.svg; then
            echo "::warning::top-langs.svg is an error card, restoring the committed version"
            git checkout -- profile/top-langs.svg 2>/dev/null || rm -f profile/top-langs.svg
          fi

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg 2>/dev/null || true
          git commit -m "chore: update top languages card" || exit 0
          git push
